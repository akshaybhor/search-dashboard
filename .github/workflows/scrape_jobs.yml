name: Nightly Tech & Direct ATS Sweep

on:
  schedule:
    # 03:13 UTC ≈ 8 PM PDT (UTC-7); in PST (UTC-8) ~7 PM PT.
    # Off-hour minute (:13) avoids GitHub Actions throttling at :00.
    - cron: "13 3 * * *"

  workflow_dispatch:

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  scrape:
    name: Nightly Tech Scrape
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run scraper (Nightly tech sweep, last 24h)
        run: python scrape_jobs.py --nightly-tech
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          NOTIFY_TERMS: ${{ vars.NOTIFY_TERMS }}

      - name: Auto-resolve direct ATS company portals
        run: python resolve_ats.py --enrich

      - name: Discover and register new ATS portals from candidate employers
        run: python discover_candidate_portals.py --limit 30

      - name: Scrape direct ATS career portals (Greenhouse, Ashby, Lever, Workday)
        run: python scrape_direct_ats.py --lookback 48 --limit 0

      - name: Prune excluded companies from Company Directory
        run: python company_directory.py --prune

      - name: Record workflow run
        run: |
          python - <<'EOF'
          import json
          import os
          from datetime import datetime, timezone

          with open("jobs.json", encoding="utf-8") as f:
              data = json.load(f)

          entry = {
              "workflow": "nightly_tech",
              "timestamp": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "job_count": int(data.get("total", 0)),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
          }

          with open("workflow_runs.jsonl", "a", encoding="utf-8") as f:
              f.write(json.dumps(entry, sort_keys=True) + "\n")
          EOF

      - name: Commit results to repo
        run: |
          git config user.name  "JobBot"
          git config user.email "jobbot@users.noreply.github.com"
          python ci_commit_push.py \
            --message "chore: update nightly tech listings [$(date -u '+%Y-%m-%d')]" \
            jobs.json jobs.md jobs.html \
            workflow_runs.jsonl all_jobs.json notified.json companies.json probed_companies_cache.json
