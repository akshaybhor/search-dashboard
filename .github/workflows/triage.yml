name: Nightly Job Triage

on:
  schedule:
    # Staggered at :47 (offset from :17 scrapers) + 06:47 UTC pre-auto-apply slot
    - cron: "47 6 * * *"   # 6:47 AM UTC (1:47 AM EST — scores overnight jobs before 4:30 AM EST auto-apply)
    - cron: "47 13 * * *"  # 1:47 PM UTC
    - cron: "47 16 * * *"  # 4:47 PM UTC
    - cron: "47 19 * * *"  # 7:47 PM UTC
    - cron: "47 22 * * *"  # 10:47 PM UTC
    - cron: "47 1 * * *"   # 1:47 AM UTC

  workflow_dispatch:

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  triage:
    name: Score new roles vs candidate profile
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Runner 1: Gemini Key 1
      - name: Run triage agent (Gemini Key 1)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_1 }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CANDIDATE_RESUME: ${{ secrets.CANDIDATE_RESUME }}
        run: python triage_agent.py --limit 200

      # Runner 2: Gemini Key 2
      - name: Run triage agent (Gemini Key 2)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_2 }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CANDIDATE_RESUME: ${{ secrets.CANDIDATE_RESUME }}
        run: python triage_agent.py --limit 200

      # Runner 3: Gemini Key 3
      - name: Run triage agent (Gemini Key 3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_3 }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CANDIDATE_RESUME: ${{ secrets.CANDIDATE_RESUME }}
        run: python triage_agent.py --limit 200

      # Runner 4: Gemini Key 4
      - name: Run triage agent (Gemini Key 4)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_4 }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CANDIDATE_RESUME: ${{ secrets.CANDIDATE_RESUME }}
        run: python triage_agent.py --limit 200

      # Runner 5: Gemini Key 5
      - name: Run triage agent (Gemini Key 5)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_5 }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CANDIDATE_RESUME: ${{ secrets.CANDIDATE_RESUME }}
        run: python triage_agent.py --limit 200

      - name: Commit scores to repo
        run: |
          git config user.name  "JobBot"
          git config user.email "jobbot@users.noreply.github.com"
          python ci_commit_push.py \
            --message "chore: update fit scores [$(date -u '+%Y-%m-%d %H:%MZ')]" \
            scores.json
